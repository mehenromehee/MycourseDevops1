name: CI Action Pipeline

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch: 

jobs:
  sonarqube:
    runs-on: wsl-linux
    if: github.event_name == 'pull_request'

    steps:
      - name: Clone code
        uses: actions/checkout@v7

      - name: SonarQube Analysis
        uses: SonarSource/sonarqube-scan-action@v8
        with:
          args: >
            -Dsonar.projectKey=NodeApplication
            -Dsonar.sources=.
            -Dsonar.host.url=${{ vars.SONAR_HOST_URL }}
            -Dsonar.token=${{ secrets.SONAR_TOKEN }}
            -Dsonar.qualitygate.wait=true

  docker:
    runs-on: wsl-linux
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    environment: ${{ github.ref_name == 'main' && 'prod' || 'dev' }}

    steps:
      - name: Clone code
        uses: actions/checkout@v7

      - name: Login Build and Push to DockerHub
        uses: karthipv-07/RevampBatch08/.github/actions/docker-build-push@main
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}
          dockerfile-name: Dockerfile.distroless
          dockerhub-repo: nodeapp8
