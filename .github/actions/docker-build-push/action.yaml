name: Docker Build and Push

inputs:
  username:
    description: DockerHub username
    required: true
  password:
    description: DockerHub password
    required: true
  dockerfile-name:
    description: Dockerfile name
    required: true
  dockerhub-repo:
    description: DockerHub repo name
    required: true

runs:
  using: "composite"

  steps:
    - name: Login to DockerHub
      uses: docker/login-action@v4
      with:
        username: ${{ inputs.username }}
        password: ${{ inputs.password }}

    - name: Build Docker image
      shell: bash
      run: docker build -f ${{ inputs.dockerfile-name }} -t dockerfile .

    - name: Tag and Push Docker image
      shell: bash
      run: |
        SHORT_SHA=${GITHUB_SHA::7}
        docker tag dockerfile ${{ inputs.username }}/${{ inputs.dockerhub-repo }}:$SHORT_SHA
        docker push ${{ inputs.username }}/${{ inputs.dockerhub-repo }}:$SHORT_SHA
